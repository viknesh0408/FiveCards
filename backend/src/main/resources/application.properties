# Spring Application Settings
spring.application.name=tickgame
server.port=8080

# DataSource Configuration: H2 database by default
spring.datasource.url=jdbc:h2:mem:tickgamedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Settings
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA/Hibernate Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# WebSocket settings (optional tuning)
# spring.websocket.server.max-text-message-buffer-size=81920
